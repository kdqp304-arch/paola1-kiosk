<style>
/* Pretendard (SIL OFL 1.1), variable weight, cut down to the glyphs this page uses and embedded so it renders the same offline */
@font-face{font-family:"Pretendard";font-style:normal;font-weight:100 900;font-display:swap;src:url(pretendard-subset.woff2) format("woff2")}
/* Layout: one device-screen stage fitted to the viewport. Portrait stacks step bar / touch band / key visual; landscape sets touch band and key visual side by side (1 : 1.1) under a full-width step bar. Everything inside the stage is sized in --u, 1% of its short edge. */
:root{
  --ink:#034a68;
  --ink-deep:#05384f;
  --teal:#0a566f;
  --deep:#063f5e;
  --glow:#d4fb6a;
  --lime:#aed200;
  --paper:#f8f9f4;
  --mute:#8fa09a;
  --rule:#dce3db;
  --flash:#fbffe0;
  --page:#0a1a24;
  --page-fg:#c9d7dd;
  --panel:#10303f;
  --font-ko:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-en:"Montserrat","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--page-fg);font-family:var(--font-ko);font-kerning:normal;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.app{height:100%;display:grid;place-items:center}
.frame{position:relative;width:100%;height:100%;flex:none}
.app.framed .frame{border-radius:18px;overflow:hidden;box-shadow:0 0 0 9px #12303f,0 0 0 10px #24566d,0 32px 90px #000b}

.stage{
  --u:.7vmin;--charge:0;
  position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;
  display:grid;grid-template-columns:100%;grid-template-rows:minmax(calc(var(--u)*27),auto) minmax(calc(var(--u)*38),31%) minmax(0,1fr);
  background:var(--deep);color:#fff;font-family:var(--font-ko);cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.stage[data-o="l"]{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto minmax(0,1fr)}
.stage[data-o="l"] .touch{grid-area:2/1}
.stage[data-o="l"] .visual{grid-area:2/2}
.stage[data-o="l"] .steps{grid-area:1/1/2/3}
.stage{letter-spacing:-.012em}

/* A. touch band */
.touch{
  grid-area:2/1;position:relative;min-height:0;overflow:hidden;
  display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr auto;
  column-gap:calc(var(--u)*4.2);
  padding:calc(var(--u)*3.4) calc(var(--u)*6.5) calc(var(--u)*3);
  background:radial-gradient(120% 90% at 18% 50%,#0d6c86 0%,transparent 62%),linear-gradient(180deg,var(--teal),var(--deep) 80%);
}
.touch::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(rgba(255,255,255,.1) 0 1px,transparent 1.5px) 0 0/calc(var(--u)*2.4) calc(var(--u)*2.4),
    linear-gradient(103deg,transparent 71.8%,rgba(255,255,255,.15) 72%,transparent 72.25%),
    linear-gradient(103deg,transparent 83.8%,rgba(255,255,255,.08) 84%,transparent 84.2%);
}
.touch::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(55% 85% at var(--rx,24%) 52%,rgba(212,251,106,.6),transparent 72%);
  opacity:calc(var(--charge)*.9);
}
.touch>*{position:relative;z-index:1}
.status{grid-column:1/-1;margin:0;text-align:center;font-size:calc(var(--u)*3.3);font-weight:500;line-height:1.3;letter-spacing:-.02em;color:rgba(236,247,249,.88);min-height:1.3em}
.ringwrap{grid-row:2;grid-column:1;align-self:center;position:relative;width:calc(var(--u)*23);aspect-ratio:1}
.stage[data-o="l"] .ringwrap{width:calc(var(--u)*22)}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.halo{fill:none;stroke:rgba(212,251,106,.24);stroke-width:1;transform-origin:100px 100px;animation:halo 2.8s ease-in-out infinite}
.disc{fill:rgba(3,70,98,.6);stroke:var(--glow);stroke-width:2.6;filter:drop-shadow(0 0 5px rgba(212,251,106,.8));transition:fill .2s}
.dash{fill:none;stroke:rgba(212,251,106,.5);stroke-width:1;stroke-dasharray:3 4}
.prog{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:100px 100px;filter:drop-shadow(0 0 7px var(--glow));opacity:0;transition:opacity .15s}
.stage[data-hold="1"] .prog{opacity:1}
.stage.pressed .disc{fill:rgba(6,100,132,.75)}
.hand{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);fill:none;stroke:var(--glow);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 10px rgba(212,251,106,.7))}
.prompt{grid-row:2;grid-column:2;align-self:center;min-width:0}
.p-ko{margin:0;font-size:calc(var(--u)*4.4);font-weight:600;line-height:1.28;letter-spacing:-.03em;word-break:keep-all;text-wrap:balance}
.stage[data-o="l"] .p-ko{font-size:calc(var(--u)*3.8)}
.p-en{margin:calc(var(--u)*1.4) 0 0;font:500 calc(var(--u)*2.3)/1.25 var(--font-en);letter-spacing:.24em;color:rgba(255,255,255,.62)}
.in{animation:rise .45s ease both}
.trial{grid-column:1/-1;grid-row:3;display:flex;align-items:center;gap:calc(var(--u)*2.4);margin:0;font:500 calc(var(--u)*2.2)/1 var(--font-en);letter-spacing:.18em;color:rgba(255,255,255,.66)}
.trial b{white-space:nowrap;font-weight:700;font-size:calc(var(--u)*2.8);letter-spacing:.06em;color:#fff}
.trial i{flex:none;width:calc(var(--u)*6);height:1px;background:rgba(255,255,255,.55)}
.trial span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage[data-o="l"] .trial{gap:calc(var(--u)*1.8);font-size:calc(var(--u)*1.8);letter-spacing:.14em}
.stage[data-o="l"] .trial b{font-size:calc(var(--u)*2.3)}
.stage[data-o="l"] .trial i{width:calc(var(--u)*3)}

/* touch prompt: the text glints, the hand glows and twinkles */
.p-ko,.p-en{animation:shimmer 3.6s ease-in-out infinite}
.p-ko.in,.p-en.in{animation:rise .45s ease both,shimmer 3.6s ease-in-out infinite}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .p-ko,.p-en{
    width:fit-content;max-width:100%;
    background-image:linear-gradient(100deg,var(--b) 0 40%,var(--h) 50%,var(--b) 60% 100%);
    background-size:260% 100%;background-repeat:no-repeat;background-position:100% 0;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .p-ko{--b:#fff;--h:#d4fb6a}
  .p-en{--b:rgba(255,255,255,.62);--h:#fff}
}
.hand{animation:handglow 2.4s ease-in-out infinite}
.disc{animation:discglow 2.4s ease-in-out infinite}
.sp{position:absolute;z-index:2;left:var(--x);top:var(--y);width:var(--s);height:var(--s);fill:#fff;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(0);filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 8px rgba(212,251,106,.95));animation:twinkle 2.7s ease-in-out var(--d) infinite}
.stage[data-hold="1"] .sp{display:none}
.stage[data-state="3"] .touch *{animation-play-state:paused}
@keyframes shimmer{0%{background-position:100% 0}55%,100%{background-position:0 0}}
@keyframes handglow{
  0%,100%{transform:translate(-50%,-50%) scale(1);stroke:var(--glow);filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 10px rgba(212,251,106,.7))}
  50%{transform:translate(-50%,-50%) scale(1.07);stroke:#f6ffd0;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 20px rgba(212,251,106,1))}
}
@keyframes discglow{0%,100%{filter:drop-shadow(0 0 5px rgba(212,251,106,.8))}50%{filter:drop-shadow(0 0 12px rgba(212,251,106,1))}}
@keyframes twinkle{
  0%,100%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0deg)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(50deg)}
  34%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(100deg)}
}

/* B. key visual: a different photo for every touch, with the campaign overlays on top */
.visual{grid-area:3/1;position:relative;overflow:hidden;min-height:0;margin:0;background:#2b3a2f}
.ph{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% var(--py,58%);opacity:0;transition:opacity .7s ease}
.ph.on{opacity:1}
.visual::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(2,30,45,.62),rgba(2,30,45,0) 36%)}
.visual>p,.visual>i{z-index:1}
.legal{position:absolute;left:calc(var(--u)*6.5);bottom:calc(var(--u)*3.4);margin:0;color:rgba(255,255,255,.94);font-size:calc(var(--u)*2.35);font-weight:400;letter-spacing:-.01em;line-height:1.5;text-shadow:0 1px 8px rgba(0,20,30,.6)}
.stage[data-o="p"] .legal{bottom:calc(var(--u)*2.4);font-size:calc(var(--u)*2);line-height:1.4;white-space:nowrap}
.stage[data-o="p"] .legal br{display:none}
.vert{position:absolute;right:calc(var(--u)*2.4);top:calc(var(--u)*5);margin:0;writing-mode:vertical-rl;font:500 calc(var(--u)*1.8)/1 var(--font-en);letter-spacing:.3em;color:rgba(3,74,104,.8)}
.corner{position:absolute;right:0;bottom:0;width:calc(var(--u)*3);height:calc(var(--u)*10.5);background:var(--lime);clip-path:polygon(100% 0,100% 100%,0 100%)}

/* C. step bar, across the top: a slim utility row (auto reset + the reset button), then big 01 / 02 / 03 numerals, hollow until their light is on, then filled with a lime shadow */
.steps{grid-area:1/1;position:relative;z-index:2;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto 1fr;column-gap:calc(var(--u)*4);padding:0 calc(var(--u)*6.2) calc(var(--u)*1.5);background:var(--paper);color:var(--ink)}
.step{grid-row:2;display:grid;grid-template-rows:auto auto auto 1fr calc(var(--u)*2.3);min-width:0;padding-top:calc(var(--u)*1.3);color:#5f716b}
.step .n{position:relative;justify-self:start;isolation:isolate;font:italic 900 calc(var(--u)*7.8)/.84 var(--font-en);letter-spacing:-.04em;color:var(--paper);paint-order:stroke fill;-webkit-text-stroke:calc(var(--u)*.5) var(--ink);transition:color .5s}
.step .n::before{content:attr(data-n);position:absolute;left:-.045em;top:.045em;z-index:-1;color:var(--lime);-webkit-text-stroke:0;opacity:0;transition:opacity .5s}
.step .t{margin-top:calc(var(--u)*1.2);font-family:var(--font-en);font-style:italic;font-weight:900;font-size:calc(var(--u)*3.2);line-height:1.15;letter-spacing:.035em;word-spacing:.06em;white-space:nowrap;color:var(--paper);paint-order:stroke fill;-webkit-text-stroke:calc(var(--u)*.34) var(--ink);transition:color .5s}
/* Korean has no Montserrat glyphs: Pretendard Black, slanted at Montserrat Italic's own angle */
.step .t .k{display:inline-block;font-family:var(--font-ko);font-style:normal;font-weight:900;letter-spacing:.02em;transform:skewX(-11.3deg);transform-origin:50% 100%}
.step .s{margin-top:calc(var(--u)*.7);font-size:calc(var(--u)*2.3);font-weight:500;line-height:1.3;letter-spacing:-.01em;color:var(--mute)}
.step .bar{grid-row:5;align-self:end;display:block;position:relative;overflow:hidden;height:calc(var(--u)*.9);background:var(--rule)}
.step .bar::after{content:"";position:absolute;inset:0;background:var(--lime);transform:scaleX(0);transform-origin:left;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.step.on .n,.step.on .t{color:var(--ink)}
.step.on .n::before{opacity:1}
.step.on .bar::after{transform:scaleX(1)}
/* the bar of the step to touch next sweeps back and forth: step 1 on the first screen, then 2, then 3; faster while the third touch is held */
.stage[data-state="0"] .step[data-i="1"] .bar::after,.stage[data-state="1"] .step[data-i="2"] .bar::after,.stage[data-state="2"] .step[data-i="3"] .bar::after{background:linear-gradient(90deg,rgba(174,210,0,0),var(--lime) 18%,#efff96 50%,var(--lime) 82%,rgba(174,210,0,0));animation:pingpong 1s cubic-bezier(.45,0,.55,1) infinite alternate}
.stage[data-state="0"] .step[data-i="1"] .bar,.stage[data-state="1"] .step[data-i="2"] .bar,.stage[data-state="2"] .step[data-i="3"] .bar{background:#e2e9d6;height:calc(var(--u)*1.2)}
.stage[data-hold="1"] .step[data-i="3"] .bar::after{animation-duration:.5s}
.stage[data-state="3"] .step[data-i="3"] .t{justify-self:start;background:linear-gradient(transparent 60%,var(--lime) 60% 92%,transparent 92%)}
.stage[data-state="3"] .step[data-i="3"] .bar{height:calc(var(--u)*1.3)}
.stage[data-o="l"] .step .n{grid-column:1;grid-row:1;font-size:calc(var(--u)*6.2)}
.stage[data-o="l"] .step .t{grid-column:2;grid-row:1;margin-top:0;font-size:calc(var(--u)*4.2);-webkit-text-stroke-width:calc(var(--u)*.42)}
.stage[data-o="l"] .step .s{grid-column:1/-1;grid-row:2;margin-top:calc(var(--u)*.9);font-size:calc(var(--u)*2.1)}
.stage[data-o="l"] .step .bar{grid-column:1/-1;grid-row:4}
/* landscape: each title sits beside its numeral */
.stage[data-o="l"] .step{grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr calc(var(--u)*1.9);column-gap:calc(var(--u)*1.4);align-items:center;padding-top:calc(var(--u)*1)}
.stage[data-o="l"] .steps{grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:calc(var(--u)*1.2)}
/* once a step is lit its title fills with navy; a thinner outline keeps the filled letters crisp */
.stage .step.on .t{-webkit-text-stroke-width:calc(var(--u)*.12)}
.stage[data-o="l"] .auto{height:calc(var(--u)*6.4)}
.stage[data-o="l"] .back{top:calc(var(--u)*.6)}
.auto{grid-column:1/-1;grid-row:1;margin:0 calc(var(--u)*-6.2);padding:0 calc(var(--bw,0px) + var(--u)*5.4) 0 calc(var(--u)*6.2);height:calc(var(--u)*6.9);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:flex-end;gap:calc(var(--u)*1.4);font-size:calc(var(--u)*2.5);font-weight:500;letter-spacing:-.01em;line-height:1;color:#667873}
.auto svg{width:calc(var(--u)*3);height:calc(var(--u)*3);flex:none}
.auto b{font-weight:600;font-variant-numeric:tabular-nums}
.stage[data-state="0"] .auto{visibility:hidden}

/* D-day countdown while the third light is held: centred on the whole screen */
.dcount{position:absolute;inset:0;z-index:4;pointer-events:none;display:grid;place-content:center;justify-items:center;text-align:center;opacity:0;transform:scale(.94);transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1);font-family:var(--font-en)}
.dcount::before{content:"";position:absolute;inset:0;background:radial-gradient(70% calc(var(--u)*25) at 50% 50%,rgba(1,32,50,.88),rgba(1,32,50,.62) 55%,rgba(1,32,50,0) 100%)}
.dcount>*{position:relative;margin:0}
.dd{display:flex;align-items:baseline;font-size:calc(var(--u)*26);font-weight:800;line-height:1;letter-spacing:-.02em;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 calc(var(--u)*3) rgba(212,251,106,.65),0 calc(var(--u)*.4) calc(var(--u)*2) rgba(0,0,0,.5)}
.dd i{font-style:normal;color:var(--glow)}
.dd b{font-weight:800}
.dd b.tick{animation:tick .06s ease-out}
.stage[data-hold="1"][data-count="1"] .dcount{opacity:1;transform:none}

/* E. the third light: a bright panel that spreads from the ring over the touch band */
.light{
  grid-area:2/1;position:relative;z-index:3;min-height:0;overflow:hidden;color:var(--ink);
  display:grid;grid-template-rows:minmax(0,1fr);
  padding:calc(var(--u)*3.4) calc(var(--u)*6.5);
  background:
    linear-gradient(103deg,transparent 66.8%,rgba(255,255,255,.75) 67%,transparent 67.25%),
    linear-gradient(103deg,transparent 80.8%,rgba(255,255,255,.55) 81%,transparent 81.2%),
    radial-gradient(85% 70% at 40% 46%,#fff 0%,var(--flash) 26%,#e9f99c 58%,#cfe84a 100%);
  clip-path:circle(0% at var(--lcx,28%) var(--lcy,50%));visibility:hidden;
  transition:clip-path 1.15s cubic-bezier(.2,.75,.1,1) .08s,visibility 0s 1.3s;
}
.stage[data-state="3"] .light{clip-path:circle(150% at var(--lcx,28%) var(--lcy,50%));visibility:visible;transition:clip-path 1.15s cubic-bezier(.2,.75,.1,1) .08s,visibility 0s}
.l-main{position:relative;z-index:1}
.rays{position:absolute;z-index:0;left:var(--gx,35%);top:var(--gy,50%);width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 1.2s .8s;background:repeating-conic-gradient(rgba(255,255,255,.95) 0 5deg,rgba(255,255,255,0) 5deg 15deg);-webkit-mask-image:radial-gradient(closest-side,#000,rgba(0,0,0,.5) 42%,transparent 80%);mask-image:radial-gradient(closest-side,#000,rgba(0,0,0,.5) 42%,transparent 80%)}
.stage[data-state="3"] .rays{opacity:.5;animation:spin 60s linear infinite}
.l-main{align-self:center;min-width:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:calc(var(--u)*3.2);row-gap:calc(var(--u)*1.6)}
.date{flex:none;margin:0;display:flex;font:italic 900 calc(var(--u)*50*var(--df,1))/.84 var(--font-en);letter-spacing:-.045em;color:var(--ink)}
.date span{position:relative;display:inline-block;isolation:isolate;opacity:0}
.date span::before{content:attr(data-c);position:absolute;left:-.04em;top:.04em;color:var(--lime);z-index:-1}
.stage[data-state="3"] .date span{animation:land 1.05s ease-out both;animation-delay:calc(.38s + var(--i)*.09s)}
.stage[data-state="3"] .date span::before{animation:depth 2.4s ease-in-out 2.4s infinite}
.info{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*1.6)}
.l-sub{margin:0;font-size:calc(var(--u)*11);font-weight:800;line-height:1.15;letter-spacing:-.045em;opacity:0}
.ln{display:block;width:max-content;padding:0 .12em;margin-left:-.12em;background:linear-gradient(transparent 58%,var(--lime) 58% 92%,transparent 92%) 0 0/0 100% no-repeat}
.chip{display:inline-flex;align-items:center;margin:0;font-size:calc(var(--u)*4.4);font-weight:500;opacity:0}
.chip b{padding:calc(var(--u)*.7) calc(var(--u)*1.8);border-radius:calc(var(--u)*.8);background:var(--ink);color:var(--glow);font-family:var(--font-en);font-weight:700;letter-spacing:.1em}
/* landscape: 급여 and the D-day badge sit centred under the date */
.stage[data-o="l"] .l-main{flex-direction:column;justify-content:center}
.stage[data-o="l"] .info{align-items:center}
.stage[data-o="l"] .ln{margin-left:0}
.stage[data-state="3"] .l-sub{animation:rise .6s .7s ease both}
.stage[data-state="3"] .ln{animation:sweep .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.95s + var(--k)*.16s)}
.stage[data-state="3"] .chip{animation:rise .6s 1.15s ease both}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--cx,28%) var(--cy,50%),#fff 0,var(--flash) 16%,rgba(212,251,106,0) 64%)}
.flash.go{animation:flash 1s ease-out}
.fx{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.back{position:absolute;z-index:8;top:calc(var(--u)*.85);right:calc(var(--u)*2.8);display:inline-flex;align-items:center;gap:calc(var(--u)*1);height:calc(var(--u)*5.2);padding:0 calc(var(--u)*2.4) 0 calc(var(--u)*1.8);border-radius:999px;border:calc(var(--u)*.3) solid var(--ink);background:#fff;color:var(--ink);font:600 calc(var(--u)*2.4)/1 var(--font-ko);letter-spacing:-.01em;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.back::after{content:"";position:absolute;inset:calc(var(--u)*-1.2) calc(var(--u)*-1.6)}
.back svg{width:calc(var(--u)*2.9);height:calc(var(--u)*2.9);flex:none}
.back:active{background:var(--ink);color:#fff;transform:scale(.96)}
.stage[data-state="0"] .back{opacity:.6}

/* preview tools (outside the stage) */
.tools-btn{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:30;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(8,24,34,.6);color:#fff;opacity:.4;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tools-btn:hover,.tools-btn[aria-expanded="true"]{opacity:1}
.tools{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:calc(58px + env(safe-area-inset-top,0px));z-index:30;width:min(290px,calc(100vw - 20px));display:grid;gap:12px;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(10,32,45,.96);box-shadow:0 18px 50px #000a;font-size:13px;line-height:1.4;color:var(--page-fg)}
.tools h2{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.1em;color:#8fb2c0}
.tools .row{display:flex;flex-wrap:wrap;gap:6px}
.tb,.tools select{min-width:0;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);cursor:pointer}
.tb{flex:1 1 auto}
.tb:disabled{opacity:.4;cursor:default}
.tools select{width:100%}
.tools option{color:#062a3b;background:#fff}
.tb[aria-pressed="true"]{background:var(--glow);border-color:var(--glow);color:#052a3a;font-weight:600}
.tools p{margin:0;font-size:12px;color:#8fb2c0}

.snap,.snap *,.snap *::before,.snap *::after{transition:none!important;animation:none!important}
@keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*1.2))}to{opacity:1;transform:none}}
@keyframes tick{0%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes pingpong{0%{transform:translateX(-16%) scaleX(.38);opacity:.7}50%{opacity:1}100%{transform:translateX(78%) scaleX(.38);opacity:.7}}
@keyframes land{
  0%{opacity:0;transform:translateY(-34%) scale(1.7) rotate(-5deg);filter:blur(26px);animation-timing-function:cubic-bezier(.2,.9,.25,1)}
  46%{opacity:1;transform:translateY(3%) scale(.93) rotate(1.2deg);filter:blur(0);animation-timing-function:ease-in-out}
  70%{transform:translateY(-1.5%) scale(1.045) rotate(-.4deg)}
  86%{transform:translateY(.4%) scale(.99) rotate(0deg)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
@keyframes depth{0%,100%{transform:none}50%{transform:translate(-.03em,.03em)}}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes sweep{to{background-size:100% 100%}}
@keyframes flash{0%{opacity:0;transform:scale(.7)}9%{opacity:1;transform:scale(1.1)}30%{opacity:.95}100%{opacity:0;transform:scale(1.7)}}
@media (prefers-reduced-motion:reduce){
  .halo{animation:none!important}
  .stage[data-state="0"] .step[data-i="1"] .bar::after,.stage[data-state="1"] .step[data-i="2"] .bar::after,.stage[data-state="2"] .step[data-i="3"] .bar::after{animation:none;transform:scaleX(.34)}

  .light,.ph{transition-duration:.01s!important}
  .stage .date span,.stage .l-sub,.stage .ln,.stage .chip{animation-duration:.01s!important;animation-delay:0s!important}
  .rays,.stage .date span::before{animation:none!important}
  .sp,.fx{display:none}
  .dd b.tick{animation:none}
  .hand,.disc,.p-ko,.p-en{animation:none}
  .p-ko.in,.p-en.in{animation:rise .01s both}
}
</style>
<style>html:not(.dev) .tools-btn,html:not(.dev) .tools{display:none!important}</style>

<body>

        <div class="step" data-i="2"><b class="n" data-n="02">02</b><span class="t">PAOLA-1</span><span class="s">두 번째 터치</span><i class="bar"></i></div>

</main>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const app = $('#app'), frame = $('#frame'), stage = $('#stage'), visual = $('#visual');
  const statusEl = $('#status'), pko = $('#pko'), pen = $('#pen');
  const prog = $('#prog'), dnum = $('#dnum'), ringwrap = $('#ringwrap'), flash = $('#flash');
  const autoNum = $('#autoNum'), chipB = $('#chipB'), backBtn = $('#backBtn');
  const lightEl = $('#light'), touchEl = $('#touch');
  const legalEl = $('.legal');
  const steps = [...document.querySelectorAll('.step')];
  const photos = [...document.querySelectorAll('.ph')];

  const HOLD_MS = 2200;                    // how long the third touch is held when there is no countdown (from 11/1)
  const RESET_S = 60;                      // idle seconds before the screen resets
  const TARGET = new Date(2026, 10, 1);    // 11월 1일 급여
  const BASE = new Date(2026, 9, 23);      // the screen counts as 10/23 (D-9) until the real date gets there
  const COUNT_STEP = 65;                   // ms per D-number while the third touch charges; the reveal fires right after D-1
  const MIN_HOLD = 600;                    // shortest hold, so a quick tap never fires the reveal
  const PHOTO_DREAM = 912;                 // row of the photo where the baked "DREAM" ends
  const PHOTO_W = 1240, PHOTO_H = 1269, PHOTO_TOP = 281;   // photo size, and the photo row where the original design's crop began
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const COPY = [
    { s: '세 개의 빛을 켜보세요.', ko: '터치해주세요', en: 'TOUCH TO START' },
    { ko: '한 번 더 터치해주세요', en: 'TOUCH TO CONTINUE' },
    { ko: '마지막 빛은 꾹 눌러주세요', en: 'PRESS & HOLD' },
  ];

  let state = 0, sim = null, p = 0, holding = false, down = null, raf = 0, lockUntil = 0;
  let hintT = 0, left = RESET_S, orient = 'p', wakeLock = null;

  const today = () => {
    const d = sim || new Date(), t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return !sim && t < BASE ? BASE : t;
  };
  const days = () => Math.round((TARGET - today()) / 864e5);
  const held = () => holding || p > 0.001;
  /* a short buzz where the device can vibrate (Android phones); iPad has no vibration motor, so nothing happens there */
  const buzz = (pattern) => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* not supported */ } };

  /* sound for iPad, which cannot vibrate: a click per touch, a rising tick per count step, a chime and fireworks on the reveal.
     Synthesised with Web Audio (no files, works offline); iPad lets it play once the screen has been touched, and its mute setting still applies. */
  let ac = null, master = null, noiseBuf = null, soundOn = true;
  try { soundOn = localStorage.getItem('paola-sound') !== 'off'; } catch (e) { /* storage blocked */ }
  function audio() {
    if (!soundOn) return null;
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ac = new AC(); master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      return ac;
    } catch (e) { return null; }
  }
  function env(g, t, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
  function tone(f, t, dur, type, vol, f2) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(g, t, vol, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(t, dur, vol, freq, q, f2) {
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; bp.type = 'bandpass'; bp.Q.value = q; bp.frequency.setValueAtTime(freq, t); if (f2) bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(g, t, vol, dur); s.connect(bp); bp.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  }
  const sfx = {
    tap() { if (!audio()) return; const t = ac.currentTime + 0.005; noise(t, 0.03, 0.35, 3800, 0.9); tone(1250, t, 0.07, 'triangle', 0.2, 780); tone(160, t, 0.09, 'sine', 0.28, 90); },
    tick(k, n) { if (!audio()) return; const r = n > 1 ? (n - k) / (n - 1) : 1, t = ac.currentTime + 0.002; tone(700 + 760 * r, t, 0.05, 'triangle', 0.15 + 0.1 * r); },
    reveal() {
      if (!audio()) return; const t = ac.currentTime + 0.01;
      noise(t, 0.55, 0.45, 2600, 0.7, 450);
      [1046.5, 1318.5, 1568, 2093].forEach((f, i) => { tone(f, t + 0.06 + i * 0.07, 1.5, 'sine', 0.13); tone(f * 2, t + 0.06 + i * 0.07, 0.6, 'triangle', 0.03); });
    },
    pop() {
      if (!audio()) return; const t = ac.currentTime + 0.005;
      noise(t, 0.2, 0.42, 900, 0.8, 170); tone(110, t, 0.18, 'sine', 0.28, 55);
      for (let i = 0; i < 8; i++) noise(t + 0.08 + Math.random() * 0.45, 0.02, 0.1 + Math.random() * 0.1, 5000 + Math.random() * 3000, 2);
    },
    whoosh(dur) { if (!audio()) return; noise(ac.currentTime + 0.005, dur, 0.1, 600, 1.4, 3200); },
  };
  const holdMs = () => { const n = days(); return n > 0 ? Math.max(MIN_HOLD, n * COUNT_STEP) : HOLD_MS; };

  function setPrompt(ko, en) {
    if (pko.textContent === ko && pen.textContent === en) return;
    pko.textContent = ko; pen.textContent = en;
    for (const el of [pko, pen]) { el.classList.remove('in'); void el.offsetWidth; el.classList.add('in'); }
  }

  /* the screen is a pure function of state: 0 waiting, 1 and 2 after a touch, 3 revealed */
  function render() {
    const c = COPY[Math.min(state, 2)];
    statusEl.textContent = state === 0 ? c.s : '';
    if (state < 3 && !held()) setPrompt(c.ko, c.en);
    steps.forEach((el, i) => el.classList.toggle('on', i < state));
    photos.forEach((el, i) => el.classList.toggle('on', i === state));
    stage.dataset.state = String(state);
    stage.dataset.count = days() > 0 ? '1' : '0';
    autoNum.textContent = String(left);
  }
  const setState = (n) => { state = n; render(); };

  /* the big D-number while the third touch charges */
  let shown = -1;
  function showCount(k) {
    if (k === shown) return;
    shown = k;
    dnum.textContent = String(k);
    dnum.classList.remove('tick'); void dnum.offsetWidth; dnum.classList.add('tick');
    if (holding) { buzz(6); sfx.tick(k, days()); }
  }

  function paint(v) {
    prog.style.strokeDashoffset = String(100 * (1 - v));
    stage.style.setProperty('--charge', v.toFixed(3));
    const n = days();
    /* n, n-1 ... 1 spread evenly over the hold; the reveal fires the moment it fills, no D-DAY pause */
    if (n > 0) showCount(Math.max(1, n - Math.floor(v * n)));
  }

  let ctr = { x: 0, y: 0 };
  function setCenter() {
    const r = ringwrap.getBoundingClientRect(), s = stage.getBoundingClientRect();
    if (!s.width) return;
    const cx = r.left + r.width / 2 - s.left, cy = r.top + r.height / 2 - s.top;
    ctr = { x: cx, y: cy };
    const l = lightEl.getBoundingClientRect(), t = touchEl.getBoundingClientRect();
    stage.style.setProperty('--cx', cx.toFixed(1) + 'px');                          // in stage coordinates: flash, fireworks
    stage.style.setProperty('--cy', cy.toFixed(1) + 'px');
    stage.style.setProperty('--lcx', (cx - (l.left - s.left)).toFixed(1) + 'px');   // the same point inside the reveal panel
    stage.style.setProperty('--lcy', (cy - (l.top - s.top)).toFixed(1) + 'px');
    stage.style.setProperty('--rx', ((r.left + r.width / 2 - t.left) / t.width * 100).toFixed(1) + '%');   // inside the touch band
  }

  /* third touch: press and hold */
  function startHold() {
    if (holding) return;
    holding = true; cancelAnimationFrame(raf); clearTimeout(hintT);
    setCenter();
    const dur = holdMs(), t0 = performance.now() - p * dur;
    stage.dataset.hold = '1';
    setPrompt('그대로 눌러주세요', 'HOLD');
    buzz(12);
    sfx.tap();
    const step = (now) => {
      if (!holding) return;
      p = Math.min(1, (now - t0) / dur);
      paint(p);
      if (p >= 1) { complete(); return; }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  function cancelHold() {
    if (!holding) return;
    holding = false; cancelAnimationFrame(raf);
    setPrompt('끝까지 눌러주세요', 'KEEP HOLDING');
    let last = performance.now();
    const dur = holdMs();
    const back = (now) => {
      if (holding) return;
      p = Math.max(0, p - (now - last) / (dur * 0.35)); last = now;
      paint(p);
      if (p > 0) raf = requestAnimationFrame(back);
      else { stage.dataset.hold = '0'; hintT = setTimeout(render, 1600); }
    };
    raf = requestAnimationFrame(back);
  }

  function complete() {
    holding = false; cancelAnimationFrame(raf); clearTimeout(hintT);
    lockUntil = performance.now() + 1300;
    const n = days();
    chipB.textContent = n > 0 ? 'D-' + n : n === 0 ? 'D-DAY' : '적용 중';
    if (!reduce) { flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go'); }
    stage.dataset.hold = '0';
    setState(3);
    fxShow();
    buzz([35, 45, 80]);
    sfx.reveal();
  }

  /* input */
  function press(id) {
    if (state === 3 || down !== null || performance.now() < lockUntil) return;
    down = id; wake();
    left = RESET_S; autoNum.textContent = String(left);
    stage.classList.add('pressed');
    if (state === 2) startHold();
  }
  function release(id, cancelled) {
    if (down !== id) return;
    down = null; stage.classList.remove('pressed');
    if (state === 2) { cancelHold(); return; }
    if (state < 2 && !cancelled && performance.now() >= lockUntil) {
      setState(state + 1);
      buzz(18);
      sfx.tap();
      lockUntil = performance.now() + 250;
    }
  }

  function reset() {
    stage.classList.add('snap');
    holding = false; down = null; p = 0; lockUntil = 0;
    cancelAnimationFrame(raf); clearTimeout(hintT);
    stage.dataset.hold = '0'; flash.classList.remove('go'); stage.classList.remove('pressed');
    fxClear();
    paint(0);
    left = RESET_S;
    setState(0);
    void stage.offsetWidth;
    requestAnimationFrame(() => stage.classList.remove('snap'));
  }

  function goTo(n) {
    reset();
    if (n === 1 || n === 2) setState(n);
    if (n === 3) { setState(2); setTimeout(() => { if (state === 2) complete(); }, 80); }
  }

  function tickSecond() {
    if (state === 0) { left = RESET_S; return; }
    left--; autoNum.textContent = String(Math.max(left, 0));
    if (left <= 0) reset();
  }

  async function wake() {
    try {
      if (!wakeLock && 'wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }

  /* step titles keep their size unless a column is too narrow: then only that title steps down until it fits */
  const textW = (el) => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width; };
  function fitTitles() {
    const land = stage.dataset.o === 'l';
    for (const s of steps) {
      const t = s.querySelector('.t'), n = s.querySelector('.n');
      t.style.fontSize = '';
      const base = parseFloat(getComputedStyle(t).fontSize);
      /* the room beside (landscape) or under (portrait) the numeral, less the slant's overhang */
      const room = s.clientWidth - (land ? n.offsetWidth + (parseFloat(getComputedStyle(s).columnGap) || 0) : 0) - base * 0.15;
      for (let f = 1, i = 0; i < 14 && textW(t) > room; i++) { f *= 0.96; t.style.fontSize = (base * f).toFixed(2) + 'px'; }
    }
  }

  /* keep the big date as large as the panel allows, whatever font actually loads */
  function fitDate() {
    const date = $('.date'), main = $('.l-main'), light = $('#light');
    if (!main.clientWidth) return;
    const cs = getComputedStyle(light), pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    let df = 1;
    for (let i = 0; i < 16; i++) {
      date.style.setProperty('--df', df.toFixed(3));
      const fitsW = date.offsetWidth <= main.clientWidth;
      const fitsH = main.offsetHeight + pad <= light.clientHeight;
      if (fitsW && fitsH) break;
      df *= 0.93;
    }
    /* the sunburst behind the reveal radiates from the middle of the date */
    const lr = light.getBoundingClientRect(), dr = date.getBoundingClientRect();
    if (lr.width) {
      light.style.setProperty('--gx', ((dr.left + dr.width / 2 - lr.left) / lr.width * 100).toFixed(1) + '%');
      light.style.setProperty('--gy', ((dr.top + dr.height / 2 - lr.top) / lr.height * 100).toFixed(1) + '%');
    }
  }

  /* start the photo crop where the original design did, so the baked "DARE TO DREAM" lands in the same place on every screen size;
     when the photo band is short (squarer screens) slide the picture up just enough to keep "DREAM" clear of the legal line */
  function cropPhoto() {
    const w = visual.clientWidth, h = visual.clientHeight;
    if (!w || !h) return;
    const s = Math.max(w / PHOTO_W, h / PHOTO_H), room = PHOTO_H - h / s;
    let py = 50;
    if (room > 1) {
      const u = Math.min(stage.clientWidth, stage.clientHeight) / 100;
      const need = PHOTO_DREAM - (legalEl.offsetTop - 3.5 * u) / s;      // crop that puts the bottom of DREAM 3.5u above the legal line
      py = Math.min(100, Math.max(0, Math.max(PHOTO_TOP, need) / room * 100));
    }
    visual.style.setProperty('--py', py.toFixed(1) + '%');
  }

  /* the auto-reset text stops short of the reset button, whatever width the button ends up with */
  function backW() { stage.style.setProperty('--bw', backBtn.offsetWidth + 'px'); }

  /* fit the stage to the viewport (or to a device frame on desktop) */
  function layout() {
    const framed = app.classList.contains('framed');
    const W = app.clientWidth, H = app.clientHeight;
    let fw = W, fh = H;
    if (framed) {
      const pad = 28, r = orient === 'l' ? 4 / 3 : 3 / 4;
      const aw = Math.max(W - pad * 2, 100), ah = Math.max(H - pad * 2, 100);
      fw = Math.min(aw, ah * r); fh = fw / r;
    }
    frame.style.width = fw + 'px'; frame.style.height = fh + 'px';
    stage.dataset.o = framed ? orient : (fw >= fh ? 'l' : 'p');
    stage.style.setProperty('--u', (Math.min(fw, fh) / 100).toFixed(3) + 'px');
    backW(); fitTitles(); setCenter(); cropPhoto(); fitDate(); fxSize();
  }

  /* fireworks for the reveal: one canvas over the whole stage, painted only while something is in the air */
  const fx = $('#fx'), g = fx.getContext('2d');
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const PAL = [
    ['#034a68', '#0a8fb0', '#78d3ea'],   // brand blues
    ['#aed200', '#c9ef3d', '#e8ff8a'],   // brand limes
    ['#ffb400', '#ff7a1a', '#ffe08a'],   // gold
    ['#ff3d81', '#ff7aa8', '#ffc2d6'],   // pink
    ['#6b4cff', '#9a86ff', '#d0c8ff'],   // violet
  ];
  const CONF = ['#034a68', '#aed200', '#d4fb6a', '#ffb400', '#ff3d81', '#0a8fb0', '#6b4cff', '#ffffff'];
  const TRAIL = ['#ffb400', '#ff7a1a', '#ffd35c'];
  let FW = 0, FH = 0, UN = 1, DPR = 1, parts = [], fxTimers = [], fxRaf = 0, fxLast = 0, fxBusy = false, fxLoud = false;   // fxLoud: the opening salvo has sound, the calm idle fireworks do not

  function fxSize() {
    FW = stage.clientWidth; FH = stage.clientHeight; UN = Math.min(FW, FH) / 100;
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.round(FW * DPR), h = Math.round(FH * DPR);
    if (fx.width !== w || fx.height !== h) { fx.width = w; fx.height = h; }
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function add(p) {
    if (parts.length > 1100) return;
    p.age = 0;
    parts.push(p);
    if (!fxRaf && !fxBusy) { fxLast = performance.now(); fxRaf = requestAnimationFrame(fxFrame); }
  }
  const spark = (x, y, vx, vy, col, life, w, drag, gr, tau) => add({ k: 0, x, y, vx, vy, col, life, w, drag, gr, tau });

  /* a shell bursting: bright streaks in a ring plus twinkling four-point glitter */
  function burst(x, y, n, pal, power) {
    if (fxLoud) sfx.pop();
    const V = UN * 52 * power, base = rnd(0, TAU);
    for (let i = 0; i < n; i++) {
      const a = base + (i / n) * TAU + rnd(-.09, .09);
      const sp = V * (Math.random() < .6 ? rnd(.88, 1) : rnd(.3, .88));
      spark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, pick(pal), rnd(.95, 1.7), UN * rnd(.6, 1), 2, UN * 20, .09);
    }
    for (let i = 0, m = Math.round(n * .4); i < m; i++) {
      const a = rnd(0, TAU), sp = V * rnd(.15, .95);
      add({ k: 1, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: pick(pal), life: rnd(.9, 1.6), w: UN * rnd(.9, 1.7), drag: 2, gr: UN * 14, ph: rnd(0, TAU) });
    }
  }

  /* a rocket climbs and stops exactly at its target: y(t) = y0 + v0*t + a*t^2/2 with v0 = -2d/T and a = 2d/T^2 */
  function rocket(x, ty, power, n) {
    const y0 = FH + UN * 2, d = Math.max(UN * 20, y0 - ty), T = rnd(.55, .8);
    if (fxLoud) sfx.whoosh(T);
    add({ k: 3, x0: x, y0, x, y: y0, vx: rnd(-5, 5) * UN, vy0: -2 * d / T, ay: 2 * d / (T * T), T, power, n, pal: pick(PAL) });
  }

  function piece(x, y, vx, vy) {
    add({ k: 2, x, y, vx, vy, w: UN * rnd(.9, 1.6), h: UN * rnd(.5, .9), rot: rnd(0, TAU), vr: rnd(-9, 9), ph: rnd(0, TAU), fr: rnd(3, 6), fl: rnd(8, 15), col: pick(CONF), life: rnd(3.5, 5.5), drag: 1.9, gr: UN * 46 });
  }
  function cannon(x, y, ang) {
    for (let i = 0; i < 55; i++) { const a = ang + rnd(-.3, .3), sp = UN * rnd(80, 190); piece(x, y, Math.cos(a) * sp, Math.sin(a) * sp); }
  }
  function rain() {
    for (let j = 0; j < 4; j++) piece(rnd(0, FW), -UN * rnd(2, 8), rnd(-6, 6) * UN, rnd(8, 24) * UN);
  }

  function star(x, y, s, col) {
    const k = s * .2;
    g.fillStyle = col; g.beginPath();
    g.moveTo(x, y - s); g.lineTo(x + k, y - k); g.lineTo(x + s, y); g.lineTo(x + k, y + k);
    g.lineTo(x, y + s); g.lineTo(x - k, y + k); g.lineTo(x - s, y); g.lineTo(x - k, y - k);
    g.closePath(); g.fill();
  }

  /* advance one particle by dt seconds and paint it; false when it is done */
  function stepPart(p, dt) {
    p.age += dt;
    switch (p.k) {
      case 0: {                                   // streak: a line drawn back along its own velocity
        if (p.age >= p.life) return false;
        const f = 1 - p.age / p.life;
        p.vx -= p.vx * p.drag * dt; p.vy += (p.gr - p.vy * p.drag) * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        g.globalAlpha = Math.min(1, f * 1.8); g.strokeStyle = p.col; g.lineWidth = p.w * (.4 + .6 * f);
        g.beginPath(); g.moveTo(p.x - p.vx * p.tau, p.y - p.vy * p.tau); g.lineTo(p.x, p.y); g.stroke();
        return true;
      }
      case 1: {                                   // glitter
        if (p.age >= p.life) return false;
        const f = 1 - p.age / p.life;
        p.vx -= p.vx * p.drag * dt; p.vy += (p.gr - p.vy * p.drag) * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        const tw = .5 + .5 * Math.sin(p.age * 34 + p.ph), s = p.w * (.45 + .55 * f) * (.55 + .45 * tw);
        g.globalAlpha = Math.min(1, f * 2.2);
        star(p.x, p.y, s, p.col); star(p.x, p.y, s * .5, '#fff');
        return true;
      }
      case 2: {                                   // confetti: sways, flips, tumbles
        const left = p.life - p.age;
        if (left <= 0 || p.y > FH + UN * 4) return false;
        p.vx -= p.vx * p.drag * dt; p.vy += (p.gr - p.vy * p.drag) * dt;
        p.x += (p.vx + Math.sin(p.age * p.fr + p.ph) * UN * 10) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        const cs = Math.cos(p.age * p.fl + p.ph), co = Math.cos(p.rot), si = Math.sin(p.rot);
        g.globalAlpha = Math.min(1, left * 2);
        g.setTransform(DPR * co, DPR * si, -DPR * si * cs, DPR * co * cs, DPR * p.x, DPR * p.y);
        g.fillStyle = p.col; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        g.setTransform(DPR, 0, 0, DPR, 0, 0);
        return true;
      }
      case 3: {                                   // rocket
        const t = Math.min(p.age, p.T);
        p.x = p.x0 + p.vx * t; p.y = p.y0 + p.vy0 * t + .5 * p.ay * t * t;
        for (let j = 0; j < 2; j++) spark(p.x + rnd(-.3, .3) * UN, p.y, rnd(-3, 3) * UN, rnd(8, 22) * UN, pick(TRAIL), rnd(.25, .5), UN * rnd(.4, .7), 3, UN * 10, .05);
        g.globalAlpha = 1; g.fillStyle = '#fff'; g.strokeStyle = p.pal[0]; g.lineWidth = UN * .5;
        g.beginPath(); g.arc(p.x, p.y, UN * .75, 0, TAU); g.fill(); g.stroke();
        if (p.age >= p.T) { burst(p.x, p.y, p.n, p.pal, p.power); return false; }
        return true;
      }
    }
    return false;
  }

  function fxFrame(now) {
    fxRaf = 0; fxBusy = true;
    const dt = Math.min(.05, Math.max(.001, (now - fxLast) / 1000)); fxLast = now;
    g.clearRect(0, 0, FW, FH);
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = parts.length - 1; i >= 0; i--) {
      if (!stepPart(parts[i], dt)) { parts[i] = parts[parts.length - 1]; parts.pop(); }
    }
    g.globalAlpha = 1;
    fxBusy = false;
    if (parts.length && !fxRaf) fxRaf = requestAnimationFrame(fxFrame);
  }

  /* after the opening salvo the screen calms down to one small rocket every few seconds */
  function idle() {
    if (state !== 3) return;
    if (document.visibilityState === 'visible') rocket(FW * rnd(.12, .88), FH * rnd(.14, .5), .9, 64);
    fxTimers.push(setTimeout(idle, rnd(3200, 4600)));
  }

  function fxShow() {
    if (reduce) return;
    fxClear(); fxSize(); fx.hidden = false; fxLoud = true;
    const at = (ms, fn) => fxTimers.push(setTimeout(fn, ms));
    const dateAt = () => { const d = $('.date').getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: d.left + d.width / 2 - s.left, y: d.top + d.height / 2 - s.top }; };
    burst(ctr.x, ctr.y, 130, PAL.flat(), 1.6);                        // from the ring, with the flash
    at(150, () => { cannon(FW * .03, FH + UN, -58 * Math.PI / 180); cannon(FW * .97, FH + UN, -122 * Math.PI / 180); });
    for (let i = 0; i < 18; i++) at(260 + i * 140, rain);              // confetti rain, ~2.5 s
    at(330, () => { const c = dateAt(); burst(c.x, c.y, 120, PAL.flat(), 1.4); });   // the date itself goes off
    for (let i = 0; i < 7; i++) at(380 + i * 470 + rnd(-90, 90), () => rocket(FW * (i % 2 ? rnd(.58, .9) : rnd(.1, .42)), FH * rnd(.1, .55), 1.15, 90));
    at(4300, () => { fxLoud = false; idle(); });
  }

  function fxClear() {
    fxLoud = false;
    fxTimers.forEach(clearTimeout); fxTimers = [];
    cancelAnimationFrame(fxRaf); fxRaf = 0; fxBusy = false; parts = [];
    fx.width = fx.width;                 // drop the whole bitmap: a plain clearRect can be lost when the canvas is hidden right after
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    fx.hidden = true;
  }

  /* preview tools */
  const toolsBtn = $('#toolsBtn'), tools = $('#tools'), tFrame = $('#tFrame'), tOrient = $('#tOrient');
  function syncTools() {
    const framed = app.classList.contains('framed');
    tFrame.setAttribute('aria-pressed', String(framed));
    tOrient.disabled = !framed;
    tOrient.setAttribute('aria-pressed', String(orient === 'l'));
  }
  toolsBtn.addEventListener('click', () => {
    const open = tools.hidden;
    tools.hidden = !open;
    toolsBtn.setAttribute('aria-expanded', String(open));
  });
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => goTo(+b.dataset.go)));
  $('#tDate').addEventListener('change', (e) => {
    const v = e.target.value;
    sim = v === 'real' ? null : new Date(2026, 10, 1 - Number(v));
    reset();
  });
  tFrame.addEventListener('click', () => { app.classList.toggle('framed'); syncTools(); layout(); });
  tOrient.addEventListener('click', () => { orient = orient === 'p' ? 'l' : 'p'; syncTools(); layout(); });
  const tSound = $('#tSound');
  const syncSound = () => tSound.setAttribute('aria-pressed', String(soundOn));
  tSound.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('paola-sound', soundOn ? 'on' : 'off'); } catch (e) { /* storage blocked */ } syncSound(); sfx.tap(); });
  syncSound();

  stage.addEventListener('pointerdown', (e) => { if (e.button > 0) return; press(e.pointerId); });
  addEventListener('pointerup', (e) => release(e.pointerId, false));
  addEventListener('pointercancel', (e) => release(e.pointerId, true));
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  /* reset button: its own tap, never counted as a touch on the stage */
  backBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  backBtn.addEventListener('click', () => { sfx.tap(); reset(); backBtn.blur(); });
  addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && !(e.target.closest && e.target.closest('button,select,.tools'))) {
      e.preventDefault(); press('k');
    }
  });
  addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') release('k', false); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state > 0) wake(); });

  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) app.classList.remove('framed');
  syncTools(); layout(); reset();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(app);
  addEventListener('resize', layout);
  photos.forEach((img) => { if (img.decode) img.decode().then(cropPhoto, () => {}); });
  if (document.fonts && document.fonts.load) {
    Promise.all(['500 20px Montserrat', '800 20px Montserrat', 'italic 900 40px Montserrat'].map((f) => document.fonts.load(f, '0123456789.')))
      .then(() => { backW(); fitTitles(); setCenter(); fitDate(); }, () => {});
  }
  setInterval(tickSecond, 1000);
})();
</script>
<script>
(function () {
  /* preview tools stay hidden on the kiosk; open the page with #tools to bring them back */
  var tools = function () { document.documentElement.classList.toggle('dev', location.hash === '#tools'); };
  tools(); addEventListener('hashchange', tools);
  var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || local)) {
    addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
