<style>
/* Pretendard (SIL OFL 1.1), variable weight, cut down to the glyphs this page uses and embedded so it renders the same offline */
@font-face{font-family:"Pretendard";font-style:normal;font-weight:100 900;font-display:swap;src:url(pretendard-subset.woff2) format("woff2")}
/* Layout: one device-screen stage fitted to the viewport. Portrait stacks step bar / touch band / key visual; landscape sets touch band and key visual side by side (1 : 1) under a full-width step bar (20% of the height). Everything inside the stage is sized in --u, 1% of its short edge. */
:root{
  --ink:#034a68;
  --ink-deep:#05384f;
  --teal:#0a566f;
  --deep:#063f5e;
  --glow:#d4fb6a;
  --lime:#aed200;
  --paper:#f8f9f4;
  --mute:#8fa09a;
  --rule:#dce3db;
  --flash:#fbffe0;
  --page:#0a1a24;
  --page-fg:#c9d7dd;
  --panel:#10303f;
  --font-ko:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-en:"Montserrat","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}
body{margin:0;background:var(--page);color:var(--page-fg);font-family:var(--font-ko);font-kerning:normal;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.app{height:100%;display:grid;place-items:center}
.frame{position:relative;width:100%;height:100%;flex:none}
.app.framed .frame{border-radius:18px;overflow:hidden;box-shadow:0 0 0 9px #12303f,0 0 0 10px #24566d,0 32px 90px #000b}

.stage{
  --u:.7vmin;--charge:0;
  position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;
  display:grid;grid-template-columns:100%;grid-template-rows:minmax(calc(var(--u)*27),auto) minmax(calc(var(--u)*38),31%) minmax(0,1fr);
  background:var(--deep);color:#fff;font-family:var(--font-ko);cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.stage[data-o="l"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(calc(var(--u)*20),auto) minmax(0,1fr)}
.stage[data-o="l"] .touch{grid-area:2/1}
.stage[data-o="l"] .visual{grid-area:2/2}
.stage[data-o="l"] .steps{grid-area:1/1/2/3}
.stage{letter-spacing:-.012em}

/* A. touch band */
.touch{
  grid-area:2/1;position:relative;min-height:0;overflow:hidden;
  display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr auto;
  column-gap:calc(var(--u)*4.2);
  padding:calc(var(--u)*3.4) calc(var(--u)*6.5) calc(var(--u)*3);
  background:radial-gradient(120% 90% at 18% 50%,#0d6c86 0%,transparent 62%),linear-gradient(180deg,var(--teal),var(--deep) 80%);
}
.touch::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(rgba(255,255,255,.1) 0 1px,transparent 1.5px) 0 0/calc(var(--u)*2.4) calc(var(--u)*2.4),
    linear-gradient(103deg,transparent 71.8%,rgba(255,255,255,.15) 72%,transparent 72.25%),
    linear-gradient(103deg,transparent 83.8%,rgba(255,255,255,.08) 84%,transparent 84.2%);
}
.touch::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(55% 85% at var(--rx,24%) 52%,rgba(212,251,106,.6),transparent 72%);
  opacity:calc(var(--charge)*.9);
}
.touch>*{position:relative;z-index:1}
.status{grid-column:1/-1;margin:0;text-align:center;font-size:calc(var(--u)*3.3);font-weight:500;line-height:1.3;letter-spacing:-.02em;color:rgba(236,247,249,.88);min-height:1.3em}
.ringwrap{grid-row:2;grid-column:1;align-self:center;position:relative;width:calc(var(--u)*23);aspect-ratio:1}
.stage[data-o="l"] .ringwrap{width:calc(var(--u)*22)}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ringwrap.nudge{animation:nudge .45s ease}
.halo{fill:none;stroke:rgba(212,251,106,.24);stroke-width:1;transform-origin:100px 100px;animation:halo 2.8s ease-in-out infinite}
.disc{fill:rgba(3,70,98,.6);stroke:var(--glow);stroke-width:2.6;filter:drop-shadow(0 0 5px rgba(212,251,106,.8));transition:fill .2s}
.dash{fill:none;stroke:rgba(212,251,106,.5);stroke-width:1;stroke-dasharray:3 4}
.prog{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:100px 100px;filter:drop-shadow(0 0 7px var(--glow));opacity:0;transition:opacity .15s}
.stage[data-hold="1"] .prog{opacity:1}
.stage.pressed .disc{fill:rgba(6,100,132,.75)}
.hand{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%);fill:none;stroke:var(--glow);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 10px rgba(212,251,106,.7))}
.prompt{grid-row:2;grid-column:2;align-self:center;min-width:0}
.p-ko{margin:0;font-size:calc(var(--u)*4.4);font-weight:600;line-height:1.28;letter-spacing:-.03em;word-break:keep-all;text-wrap:balance}
.stage[data-o="l"] .p-ko{font-size:calc(var(--u)*3.8)}
.p-en{margin:calc(var(--u)*1.4) 0 0;font:500 calc(var(--u)*2.3)/1.25 var(--font-en);letter-spacing:.24em;color:rgba(255,255,255,.62)}
.in{animation:rise .45s ease both}
.trial{grid-column:1/-1;grid-row:3;display:flex;align-items:center;gap:calc(var(--u)*2.4);margin:0;font:500 calc(var(--u)*2.2)/1 var(--font-en);letter-spacing:.18em;color:rgba(255,255,255,.66)}
.trial b{white-space:nowrap;font-weight:700;font-size:calc(var(--u)*2.8);letter-spacing:.06em;color:#fff}
.trial i{flex:none;width:calc(var(--u)*6);height:1px;background:rgba(255,255,255,.55)}
.trial span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage[data-o="l"] .trial{gap:calc(var(--u)*1.8);font-size:calc(var(--u)*1.8);letter-spacing:.14em}
.stage[data-o="l"] .trial b{font-size:calc(var(--u)*2.3)}
.stage[data-o="l"] .trial i{width:calc(var(--u)*3)}

/* touch prompt: the text glints, the hand glows and twinkles */
.p-ko,.p-en{animation:shimmer 3.6s ease-in-out infinite}
.p-ko.in,.p-en.in{animation:rise .45s ease both,shimmer 3.6s ease-in-out infinite}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .p-ko,.p-en{
    width:fit-content;max-width:100%;
    background-image:linear-gradient(100deg,var(--b) 0 40%,var(--h) 50%,var(--b) 60% 100%);
    background-size:260% 100%;background-repeat:no-repeat;background-position:100% 0;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  }
  .p-ko{--b:#fff;--h:#d4fb6a}
  .p-en{--b:rgba(255,255,255,.62);--h:#fff}
}
.hand{animation:handglow 2.4s ease-in-out infinite}
.disc{animation:discglow 2.4s ease-in-out infinite}
.sp{position:absolute;z-index:2;left:var(--x);top:var(--y);width:var(--s);height:var(--s);fill:#fff;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(0);filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 8px rgba(212,251,106,.95));animation:twinkle 2.7s ease-in-out var(--d) infinite}
.stage[data-hold="1"] .sp{display:none}
.stage[data-state="3"] .touch *{animation-play-state:paused}
@keyframes shimmer{0%{background-position:100% 0}55%,100%{background-position:0 0}}
@keyframes handglow{
  0%,100%{transform:translate(-50%,-50%) scale(1);stroke:var(--glow);filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 10px rgba(212,251,106,.7))}
  50%{transform:translate(-50%,-50%) scale(1.07);stroke:#f6ffd0;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 20px rgba(212,251,106,1))}
}
@keyframes discglow{0%,100%{filter:drop-shadow(0 0 5px rgba(212,251,106,.8))}50%{filter:drop-shadow(0 0 12px rgba(212,251,106,1))}}
@keyframes twinkle{
  0%,100%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0deg)}
  16%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(50deg)}
  34%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(100deg)}
}

/* B. key visual: a different photo for every touch, with the campaign overlays on top */
.visual{grid-area:3/1;position:relative;overflow:hidden;min-height:0;margin:0;background:#2b3a2f}
.ph{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:50% var(--py,58%);opacity:0;transition:opacity .7s ease}
.ph.on{opacity:1}
.visual::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(2,30,45,.62),rgba(2,30,45,0) 36%)}
.visual>p,.visual>i{z-index:1}
.legal{position:absolute;left:calc(var(--u)*6.5);bottom:calc(var(--u)*3.4);margin:0;color:rgba(255,255,255,.94);font-size:calc(var(--u)*2.35);font-weight:400;letter-spacing:-.01em;line-height:1.5;text-shadow:0 1px 8px rgba(0,20,30,.6)}
.stage[data-o="p"] .legal{bottom:calc(var(--u)*2.4);font-size:calc(var(--u)*2);line-height:1.4;white-space:nowrap}
.stage[data-o="p"] .legal br{display:none}
.vert{position:absolute;right:calc(var(--u)*2.4);top:calc(var(--u)*5);margin:0;writing-mode:vertical-rl;font:500 calc(var(--u)*1.8)/1 var(--font-en);letter-spacing:.3em;color:rgba(3,74,104,.8)}
.corner{position:absolute;right:0;bottom:0;width:calc(var(--u)*3);height:calc(var(--u)*10.5);background:var(--lime);clip-path:polygon(100% 0,100% 100%,0 100%)}

/* C. step bar, across the top: a slim utility row (auto reset + the reset button), then 01 / 02 / 03 numerals with their titles centred above the bars, hollow until their light is on, then filled with a lime shadow */
.steps{grid-area:1/1;position:relative;z-index:2;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto 1fr;column-gap:calc(var(--u)*4);padding:0 calc(var(--u)*6.2) calc(var(--u)*1.5);background:var(--paper);color:var(--ink)}
.step{grid-row:2;display:grid;grid-template-rows:1fr auto auto 1fr calc(var(--u)*2.3);min-width:0;padding-top:calc(var(--u)*1.3);color:#5f716b}
.step .n{grid-row:2;position:relative;justify-self:start;isolation:isolate;font:italic 900 calc(var(--u)*7.2)/.84 var(--font-en);letter-spacing:-.04em;color:var(--paper);paint-order:stroke fill;-webkit-text-stroke:calc(var(--u)*.5) var(--ink);transition:color .5s}
.step .n::before{content:attr(data-n);position:absolute;left:-.045em;top:.045em;z-index:-1;color:var(--lime);-webkit-text-stroke:0;opacity:0;transition:opacity .5s}
.step .t{grid-row:3;margin-top:calc(var(--u)*1);font-family:var(--font-en);font-style:italic;font-weight:900;font-size:calc(var(--u)*4.2);line-height:1.15;letter-spacing:.035em;word-spacing:.06em;white-space:nowrap;color:var(--paper);paint-order:stroke fill;-webkit-text-stroke:calc(var(--u)*.4) var(--ink);transition:color .5s}
/* Korean has no Montserrat glyphs: Pretendard Black, slanted at Montserrat Italic's own angle */
.step .t .k{display:inline-block;font-family:var(--font-ko);font-style:normal;font-weight:900;letter-spacing:.02em;transform:skewX(-11.3deg);transform-origin:50% 100%}
.step .bar{grid-row:5;align-self:end;display:block;position:relative;height:calc(var(--u)*1.2);border-radius:calc(var(--u)*.6);background:#e2e9d6}
/* the bars fill while the screen is held (--f, 0..1, from the hold), in the bright, glinting lime of the first screen */
.step .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);opacity:min(1,calc(var(--f,0)*30));overflow:hidden;border-radius:inherit;background:linear-gradient(90deg,#b9dc12,var(--glow) 55%,#efff96);box-shadow:0 0 calc(var(--u)*.8) rgba(212,251,106,.95),0 0 calc(var(--u)*2) rgba(190,232,40,.5)}
.step .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.95) 50%,transparent 70%);transform:translateX(-100%);animation:glint 2.4s ease-in-out infinite}
.step[data-i="2"] .fill::after{animation-delay:.2s}
.step[data-i="3"] .fill::after{animation-delay:.4s}
.step.on .n,.step.on .t{color:var(--ink)}
.step.on .n::before{opacity:1}
.stage[data-state="3"] .step[data-i="3"] .t{justify-self:start;background:linear-gradient(transparent 60%,var(--lime) 60% 92%,transparent 92%)}
.stage[data-o="l"] .step .n{grid-column:1;grid-row:2;font-size:calc(var(--u)*6.2)}
.stage[data-o="l"] .step .t{grid-column:2;grid-row:2;margin-top:0;font-size:calc(var(--u)*5);-webkit-text-stroke-width:calc(var(--u)*.42)}
.stage[data-o="l"] .step .bar{grid-column:1/-1;grid-row:4}
/* landscape: each title sits beside its numeral, the pair centred between the top row and the bar */
.stage[data-o="l"] .step{grid-template-columns:auto 1fr;grid-template-rows:1fr auto 1fr calc(var(--u)*1.9);column-gap:calc(var(--u)*1.4);align-items:center;padding-top:calc(var(--u)*1)}
.stage[data-o="l"] .steps{grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:calc(var(--u)*1.2)}
/* once a step is lit its title fills with navy; a thinner outline keeps the filled letters crisp */
.stage .step.on .t{-webkit-text-stroke-width:calc(var(--u)*.12)}
.stage[data-o="l"] .auto{height:calc(var(--u)*6.4)}
.stage[data-o="l"] .back{top:calc(var(--u)*.6)}
.auto{grid-column:1/-1;grid-row:1;margin:0 calc(var(--u)*-6.2);padding:0 calc(var(--bw,0px) + var(--u)*5.4) 0 calc(var(--u)*6.2);height:calc(var(--u)*6.9);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:flex-end;gap:calc(var(--u)*1.4);font-size:calc(var(--u)*2.5);font-weight:500;letter-spacing:-.01em;line-height:1;color:#667873}
.auto svg{width:calc(var(--u)*3);height:calc(var(--u)*3);flex:none}
.auto b{font-weight:600;font-variant-numeric:tabular-nums}
.stage[data-state="0"] .auto{visibility:hidden}

/* D-day countdown once the three bars are full: centred on the whole screen */
.dcount{position:absolute;inset:0;z-index:4;pointer-events:none;display:grid;place-content:center;justify-items:center;text-align:center;opacity:0;transform:scale(.94);transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1);font-family:var(--font-en)}
.dcount::before{content:"";position:absolute;inset:0;background:radial-gradient(70% calc(var(--u)*25) at 50% 50%,rgba(1,32,50,.88),rgba(1,32,50,.62) 55%,rgba(1,32,50,0) 100%)}
.dcount>*{position:relative;margin:0}
.dd{display:flex;align-items:baseline;font-size:calc(var(--u)*26);font-weight:800;line-height:1;letter-spacing:-.02em;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 calc(var(--u)*3) rgba(212,251,106,.65),0 calc(var(--u)*.4) calc(var(--u)*2) rgba(0,0,0,.5)}
.dd i{font-style:normal;color:var(--glow)}
.dd b{font-weight:800}
.dd b.tick{animation:tick .06s ease-out}
.stage[data-hold="1"][data-count="1"][data-final="1"] .dcount{opacity:1;transform:none}

/* E. the third light: a bright panel that spreads from the ring over the touch band */
.light{
  grid-area:2/1;position:relative;z-index:3;min-height:0;overflow:hidden;color:var(--ink);
  display:grid;grid-template-rows:minmax(0,1fr);
  padding:calc(var(--u)*3.4) calc(var(--u)*6.5);
  background:
    linear-gradient(103deg,transparent 66.8%,rgba(255,255,255,.75) 67%,transparent 67.25%),
    linear-gradient(103deg,transparent 80.8%,rgba(255,255,255,.55) 81%,transparent 81.2%),
    radial-gradient(85% 70% at 40% 46%,#fff 0%,var(--flash) 26%,#e9f99c 58%,#cfe84a 100%);
  clip-path:circle(0% at var(--lcx,28%) var(--lcy,50%));visibility:hidden;
  transition:clip-path 1.15s cubic-bezier(.2,.75,.1,1) .08s,visibility 0s 1.3s;
}
.stage[data-state="3"] .light{clip-path:circle(150% at var(--lcx,28%) var(--lcy,50%));visibility:visible;transition:clip-path 1.15s cubic-bezier(.2,.75,.1,1) .08s,visibility 0s}
.l-main{position:relative;z-index:1}
.rays{position:absolute;z-index:0;left:var(--gx,35%);top:var(--gy,50%);width:150%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 1.2s .8s;background:repeating-conic-gradient(rgba(255,255,255,.95) 0 5deg,rgba(255,255,255,0) 5deg 15deg);-webkit-mask-image:radial-gradient(closest-side,#000,rgba(0,0,0,.5) 42%,transparent 80%);mask-image:radial-gradient(closest-side,#000,rgba(0,0,0,.5) 42%,transparent 80%)}
.stage[data-state="3"] .rays{opacity:.5;animation:spin 60s linear infinite}
.l-main{align-self:center;min-width:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:calc(var(--u)*3.2);row-gap:calc(var(--u)*1.6)}
.date{flex:none;margin:0;display:flex;font:italic 900 calc(var(--u)*50*var(--df,1))/.84 var(--font-en);letter-spacing:-.045em;color:var(--ink)}
.date span{position:relative;display:inline-block;isolation:isolate;opacity:0}
.date span::before{content:attr(data-c);position:absolute;left:-.04em;top:.04em;color:var(--lime);z-index:-1}
.stage[data-state="3"] .date span{animation:land 1.05s ease-out both;animation-delay:calc(.38s + var(--i)*.09s)}
.stage[data-state="3"] .date span::before{animation:depth 2.4s ease-in-out 2.4s infinite}
.info{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*1.6)}
.l-sub{margin:0;font-size:calc(var(--u)*11);font-weight:800;line-height:1.15;letter-spacing:-.045em;opacity:0}
.ln{display:block;width:max-content;padding:0 .12em;margin-left:-.12em;background:linear-gradient(transparent 58%,var(--lime) 58% 92%,transparent 92%) 0 0/0 100% no-repeat}
.chip{display:inline-flex;align-items:center;margin:0;font-size:calc(var(--u)*4.4);font-weight:500;opacity:0}
.chip b{padding:calc(var(--u)*.7) calc(var(--u)*1.8);border-radius:calc(var(--u)*.8);background:var(--ink);color:var(--glow);font-family:var(--font-en);font-weight:700;letter-spacing:.1em}
/* landscape: 급여 and the D-day badge sit centred under the date */

  let hintT = 0, left = RESET_S, orient = 'p', wakeLock = null;

  function fitTitles() {

  /* keep the big date as large as the panel allows, whatever font actually loads */

  /* start the photo crop where the original design did, so the baked "DARE TO DREAM" lands in the same place on every screen size;

  function cropPhoto() {
    const w = visual.clientWidth, h = visual.clientHeight;
    if (!w || !h) return;

    let py = 50;

  /* fireworks for the reveal: one canvas over the whole stage, painted only while something is in the air */
  const fx = $('#fx'), g = fx.getContext('2d');
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const PAL = [
    ['#034a68', '#0a8fb0', '#78d3ea'],   // brand blues
    ['#aed200', '#c9ef3d', '#e8ff8a'],   // brand limes
    ['#ffb400', '#ff7a1a', '#ffe08a'],   // gold
    ['#ff3d81', '#ff7aa8', '#ffc2d6'],   // pink
    ['#6b4cff', '#9a86ff', '#d0c8ff'],   // violet
  ];
  const CONF = ['#034a68', '#aed200', '#d4fb6a', '#ffb400', '#ff3d81', '#0a8fb0', '#6b4cff', '#ffffff'];
  const TRAIL = ['#ffb400', '#ff7a1a', '#ffd35c'];
  let FW = 0, FH = 0, UN = 1, DPR = 1, parts = [], fxTimers = [], fxRaf = 0, fxLast = 0, fxBusy = false, fxLoud = false;   // fxLoud: the opening salvo has sound, the calm idle fireworks do not

  function fxSize() {

  function burst(x, y, n, pal, power) {

  /* a rocket climbs and stops exactly at its target: y(t) = y0 + v0*t + a*t^2/2 with v0 = -2d/T and a = 2d/T^2 */
  function rocket(x, ty, power, n) {

  }

  function piece(x, y, vx, vy) {

  }

    for (let i = 0; i < 55; i++) { const a = ang + rnd(-.3, .3), sp = UN * rnd(80, 190); piece(x, y, Math.cos(a) * sp, Math.sin(a) * sp); }
  }
  function rain() {
    for (let j = 0; j < 4; j++) piece(rnd(0, FW), -UN * rnd(2, 8), rnd(-6, 6) * UN, rnd(8, 24) * UN);

    g.closePath(); g.fill();
  }

  /* advance one particle by dt seconds and paint it; false when it is done */
  function stepPart(p, dt) {

        if (p.age >= p.life) return false;

        p.x += p.vx * dt; p.y += p.vy * dt;

        const t = Math.min(p.age, p.T);

        for (let j = 0; j < 2; j++) spark(p.x + rnd(-.3, .3) * UN, p.y, rnd(-3, 3) * UN, rnd(8, 22) * UN, pick(TRAIL), rnd(.25, .5), UN * rnd(.4, .7), 3, UN * 10, .05);

  }

  function fxFrame(now) {

  /* after the opening salvo the screen calms down to one small rocket every few seconds */
  function idle() {

  }

  function fxShow() {
    if (reduce) return;
    fxClear(); fxSize(); fx.hidden = false; fxLoud = true;
    const at = (ms, fn) => fxTimers.push(setTimeout(fn, ms));
    const dateAt = () => { const d = $('.date').getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: d.left + d.width / 2 - s.left, y: d.top + d.height / 2 - s.top }; };
    burst(ctr.x, ctr.y, 130, PAL.flat(), 1.6);                        // from the ring, with the flash
    at(150, () => { cannon(FW * .03, FH + UN, -58 * Math.PI / 180); cannon(FW * .97, FH + UN, -122 * Math.PI / 180); });
    for (let i = 0; i < 18; i++) at(260 + i * 140, rain);              // confetti rain, ~2.5 s
    at(330, () => { const c = dateAt(); burst(c.x, c.y, 120, PAL.flat(), 1.4); });   // the date itself goes off
    for (let i = 0; i < 7; i++) at(380 + i * 470 + rnd(-90, 90), () => rocket(FW * (i % 2 ? rnd(.58, .9) : rnd(.1, .42)), FH * rnd(.1, .55), 1.15, 90));
    at(4300, () => { fxLoud = false; idle(); });
  }

  function fxClear() {
    fxLoud = false;
    fxTimers.forEach(clearTimeout); fxTimers = [];
    cancelAnimationFrame(fxRaf); fxRaf = 0; fxBusy = false; parts = [];
    fx.width = fx.width;                 // drop the whole bitmap: a plain clearRect can be lost when the canvas is hidden right after
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    fx.hidden = true;
  }

  /* preview tools */
  const toolsBtn = $('#toolsBtn'), tools = $('#tools'), tFrame = $('#tFrame'), tOrient = $('#tOrient');
  function syncTools() {
    const framed = app.classList.contains('framed');
    tFrame.setAttribute('aria-pressed', String(framed));
    tOrient.disabled = !framed;
    tOrient.setAttribute('aria-pressed', String(orient === 'l'));
  }
  toolsBtn.addEventListener('click', () => {
    const open = tools.hidden;
    tools.hidden = !open;
    toolsBtn.setAttribute('aria-expanded', String(open));
    if (open) showLog();
  });
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => goTo(+b.dataset.go)));
  $('#tDate').addEventListener('change', (e) => {
    const v = e.target.value;
    sim = v === 'real' ? null : new Date(2026, 10, 1 - Number(v));
    reset();
  });
  tFrame.addEventListener('click', () => { app.classList.toggle('framed'); syncTools(); layout(); });
  tOrient.addEventListener('click', () => { orient = orient === 'p' ? 'l' : 'p'; syncTools(); layout(); });
  const tSound = $('#tSound');
  const syncSound = () => tSound.setAttribute('aria-pressed', String(soundOn));
  tSound.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('paola-sound', soundOn ? 'on' : 'off'); } catch (e) { /* storage blocked */ } syncSound(); sfx.tap(0); });
  syncSound();

  /* participation log: how many times the reveal was reached, per day (real calendar date), kept on this device only */
  const LOG_KEY = 'paola-reveals', WD = ['일', '월', '화', '수', '목', '금', '토'];
  const pToday = $('#pToday'), pWeek = $('#pWeek'), pAll = $('#pAll'), pDays = $('#pDays'), pCopy = $('#pCopy'), pReset = $('#pReset');
  const pad2 = (x) => String(x).padStart(2, '0');
  const dayKey = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const dayLabel = (d) => (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')';
  function readLog() {
    try { const o = JSON.parse(localStorage.getItem(LOG_KEY) || '{}'); return o && typeof o === 'object' && !Array.isArray(o) ? o : {}; } catch (e) { return {}; }
  }
  function writeLog(o) { try { localStorage.setItem(LOG_KEY, JSON.stringify(o)); } catch (e) { /* storage blocked: nothing kept */ } }
  function countReveal() { const o = readLog(), k = dayKey(new Date()); o[k] = (+o[k] || 0) + 1; writeLog(o); showLog(); }
  function lastWeek() {
    const o = readLog(), t = new Date(), out = [];
    for (let i = 0; i < 7; i++) { const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i); out.push({ d, c: +o[dayKey(d)] || 0 }); }
    return { o, days: out };
  }
  function showLog() {
    const { o, days } = lastWeek(), top = Math.max(1, ...days.map((x) => x.c));
    pToday.textContent = String(days[0].c);
    pWeek.textContent = String(days.reduce((a, x) => a + x.c, 0));
    pAll.textContent = String(Object.values(o).reduce((a, v) => a + (+v || 0), 0));
    pDays.innerHTML = days.map((x, i) => '<li' + (i ? '' : ' class="today"') + '><span>' + dayLabel(x.d) + '</span><i style="--w:' + (x.c / top).toFixed(3) + '"></i><b>' + x.c + '</b></li>').join('');
  }
  function logText() {
    const { days } = lastWeek(), sum = days.reduce((a, x) => a + x.c, 0);
    return ['PAOLA-1 터치 화면 완료 횟수 ' + dayLabel(days[6].d) + '~' + dayLabel(days[0].d) + ': 총 ' + sum + '회']
      .concat(days.map((x) => '- ' + dayLabel(x.d) + ' ' + x.c + '회')).join('\n');
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) { /* fall back below */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  function say(btn, text, ms) {
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = text; clearTimeout(btn.sayT);
    btn.sayT = setTimeout(() => { btn.textContent = btn.dataset.label; }, ms || 1600);
  }
  pCopy.addEventListener('click', async () => { say(pCopy, (await copyText(logText())) ? '복사했어요' : '복사가 안 돼요'); });
  let armed = 0;
  pReset.addEventListener('click', () => {
    if (Date.now() - armed < 3000) { writeLog({}); showLog(); armed = 0; say(pReset, '지웠어요'); return; }
    armed = Date.now(); say(pReset, '한 번 더 누르면 지워져요', 3000);
  });
  showLog();

  stage.addEventListener('pointerdown', (e) => { if (e.button > 0) return; press(e.pointerId); });
  addEventListener('pointerup', (e) => release(e.pointerId));
  addEventListener('pointercancel', (e) => release(e.pointerId));
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  /* iPad Safari zooms the page on a quick double tap or a pinch; a touch screen like this one should never move.
     (touch-action: manipulation in the CSS covers most of it; this also stops the second tap and the pinch gesture.) */
  const vp = document.querySelector('meta[name="viewport"]');
  if (vp && !/user-scalable/.test(vp.content)) vp.content += ', maximum-scale=1, user-scalable=no';
  let lastTouchEnd = -1e9;
  document.addEventListener('touchend', (e) => { if (e.timeStamp - lastTouchEnd < 400 && e.cancelable) e.preventDefault(); lastTouchEnd = e.timeStamp; }, { passive: false });
  for (const t of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
  /* reset button: its own tap, never counted as a touch on the stage */
  backBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  backBtn.addEventListener('click', () => { sfx.tap(0); reset(); backBtn.blur(); });
  addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && !(e.target.closest && e.target.closest('button,select,.tools'))) {
      e.preventDefault(); press('k');
    }
  });
  addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') release('k'); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state > 0) wake(); });

  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) app.classList.remove('framed');
  syncTools(); layout(); reset();
  if (window.ResizeObserver) new ResizeObserver(layout).observe(app);
  addEventListener('resize', layout);
  photos.forEach((img) => { if (img.decode) img.decode().then(cropPhoto, () => {}); });
  if (document.fonts && document.fonts.load) {
    Promise.all(['500 20px Montserrat', '800 20px Montserrat', 'italic 900 40px Montserrat'].map((f) => document.fonts.load(f, '0123456789.')))
      .then(() => { backW(); fitTitles(); setCenter(); fitDate(); }, () => {});
  }
  setInterval(tickSecond, 1000);
})();
</script>
<script>
(function () {
  /* preview tools stay hidden on the kiosk; open the page with #tools to bring them back */
  var tools = function () { document.documentElement.classList.toggle('dev', location.hash === '#tools'); };
  tools(); addEventListener('hashchange', tools);
  var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || local)) return;
  var sw = navigator.serviceWorker, had = !!sw.controller, reloading = false;
  /* a new version took over: reload on the start screen, never in the middle of a touch sequence */
  function reloadWhenIdle() {
    if (reloading) return;
    var st = document.getElementById('stage');
    var idle = document.hidden || !st || (st.getAttribute('data-state') === '0' && st.getAttribute('data-hold') !== '1');
    if (idle) { reloading = true; location.reload(); } else setTimeout(reloadWhenIdle, 1500);
  }
  sw.addEventListener('controllerchange', function () { if (had) reloadWhenIdle(); had = true; });
  addEventListener('load', function () {
    sw.register('sw.js').then(function (reg) {
      /* iPad keeps a home-screen app suspended instead of reopening it, so look for a new version whenever it comes back */
      var last = Date.now();
      var check = function () { last = Date.now(); reg.update().catch(function () {}); };
      document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - last > 60000) check(); });
      setInterval(check, 30 * 60 * 1000);
    }).catch(function () {});
  });
})();
</script>
